[package]
name = "waycontrol-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "waycontrold"
path = "src/main.rs"

[dependencies]
waycontrol-core = { path = "../waycontrol-core" }
waycontrol-telemetry = { path = "../waycontrol-telemetry" }
waycontrol-protocol = { path = "../waycontrol-protocol" }
waycontrol-compositor = { path = "../waycontrol-compositor" }
waycontrol-backend-hyprland = { path = "../waycontrol-backend-hyprland" }
waycontrol-backend-sway = { path = "../waycontrol-backend-sway" }
waycontrol-backend-niri = { path = "../waycontrol-backend-niri" }
waycontrol-backend-kwin = { path = "../waycontrol-backend-kwin" }
waycontrol-backend-gnome = { path = "../waycontrol-backend-gnome" }
axum.workspace = true
axum-server.workspace = true
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
async-trait.workspace = true
rcgen.workspace = true
sha2.workspace = true
hex.workspace = true
getrandom.workspace = true
rustls-pki-types.workspace = true
serde.workspace = true
thiserror.workspace = true
serde_json.workspace = true
tokio.workspace = true
nvml-wrapper = "0.13.0"
futures-util.workspace = true
zbus.workspace = true
base64 = "0.22"
qrcodegen = "1.8.0"
libc = "0.2"

[dev-dependencies]
tower.workspace = true
