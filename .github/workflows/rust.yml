name: Rust

on:
  push:
  pull_request:

jobs:
  kwin-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install KWin test compositor and dependencies
        run: sudo apt-get update && sudo apt-get install -y kwin-wayland dbus-daemon
      - name: Exercise KWin adapter in a virtual compositor
        run: dbus-run-session -- ./scripts/test-kwin-virtual.sh

  niri-live:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Niri test compositor and dependencies
        run: pacman -Syu --noconfirm --needed niri foot ttf-dejavu libxcursor libxkbcommon-x11 xorg-server-xvfb xorg-xdpyinfo dbus rust cargo
      - name: Exercise Niri adapter in a nested compositor
        run: dbus-run-session -- ./scripts/test-niri-winit.sh

  sway-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install headless Sway test dependencies
        run: sudo apt-get update && sudo apt-get install -y sway xwayland xterm dbus-daemon
      - name: Exercise Sway adapter against a headless compositor
        run: dbus-run-session -- ./scripts/test-sway-headless.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install session bus for KWin adapter tests
        run: sudo apt-get update && sudo apt-get install -y dbus-daemon
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: dbus-run-session -- cargo test --workspace
      - run: cargo build --workspace --release
      - name: Exercise authenticated HTTP framing under TLS
        run: python3 scripts/test-http-framing.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
        working-directory: android
      - name: Enable KVM for Android emulator tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose instrumentation tests on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
          working-directory: android
