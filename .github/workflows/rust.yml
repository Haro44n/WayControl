name: Rust

on:
  push:
  pull_request:

jobs:
  kwin-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install KWin test compositor and dependencies
        run: sudo apt-get update && sudo apt-get install -y kwin-wayland dbus-daemon
      - name: Exercise KWin adapter in a virtual compositor
        run: dbus-run-session -- ./scripts/test-kwin-virtual.sh

  niri-live:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Niri test compositor and dependencies
        run: pacman -Syu --noconfirm --needed niri foot ttf-dejavu libxcursor libxkbcommon-x11 xorg-server-xvfb xorg-xdpyinfo dbus rust cargo
      - name: Exercise Niri adapter in a nested compositor
        run: dbus-run-session -- ./scripts/test-niri-winit.sh

  sway-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install headless Sway test dependencies
        run: sudo apt-get update && sudo apt-get install -y sway xwayland xterm dbus-daemon
      - name: Exercise Sway adapter against a headless compositor
        run: dbus-run-session -- ./scripts/test-sway-headless.sh

  gnome-live:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nested GNOME Shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus-daemon fuse3 gnome-shell gjs libglib2.0-bin weston xvfb
      - name: Report GNOME test runtime
        run: gnome-shell --version && gjs --version
      - name: Exercise the optional bridge in an isolated nested GNOME Shell
        run: ./scripts/test-gnome-nested.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install session bus for KWin adapter tests
        run: sudo apt-get update && sudo apt-get install -y dbus-daemon
      - run: cargo fmt --all -- --check
      - run: node --check packaging/gnome/extension/extension.js
      - run: python3 scripts/test-gnome-extension.py
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: dbus-run-session -- cargo test --workspace
      - run: cargo build --workspace --release
      - name: Exercise authenticated HTTP framing under TLS
        run: python3 scripts/test-http-framing.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
        working-directory: android
      - name: Verify signed release variant with an ephemeral CI key
        working-directory: android
        env:
          WAYCONTROL_RELEASE_STORE_FILE: ${{ runner.temp }}/waycontrol-ci-release.jks
          WAYCONTROL_RELEASE_KEY_ALIAS: waycontrol-ci
        run: |
          ci_password="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          export WAYCONTROL_RELEASE_STORE_PASSWORD="$ci_password"
          export WAYCONTROL_RELEASE_KEY_PASSWORD="$ci_password"
          keytool -genkeypair -keystore "$WAYCONTROL_RELEASE_STORE_FILE" -storepass "$WAYCONTROL_RELEASE_STORE_PASSWORD" -keypass "$WAYCONTROL_RELEASE_KEY_PASSWORD" -alias "$WAYCONTROL_RELEASE_KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 365 -dname "CN=WayControl CI, OU=Build Verification, O=WayControl, C=US"
          ./gradlew clean assembleRelease
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Enable KVM for Android emulator tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Compose instrumentation tests on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest
          working-directory: android
