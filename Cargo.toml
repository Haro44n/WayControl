[workspace]
resolver = "2"
members = [
    "crates/waycontrol-compositor",
    "crates/waycontrol-backend-hyprland",
    "crates/waycontrol-backend-sway",
    "crates/waycontrol-backend-niri",
    "crates/waycontrol-backend-kwin",
    "crates/waycontrol-core",
    "crates/waycontrol-protocol",
    "crates/waycontrol-hyprland",
    "crates/waycontrol-telemetry",
    "crates/waycontrol-server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "time", "process"] }
axum = { version = "0.8", features = ["json"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
futures-util = "0.3"
async-trait = "0.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
rcgen = "0.14"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.3"
tower = { version = "0.5", features = ["util"] }
rustls-pki-types = "1"
